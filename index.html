<!-- Funciones extra globales -->
<script>
// Logout
function logout() {
  if (!confirm('¿Cerrar sesión?')) return;
  App.user = null;
  document.getElementById('login-screen').style.display = '';
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginEmail').value = '';
  document.getElementById('loginPassword').value = '';
}

// Verificar alertas SLA desde topbar
async function verificarAlertas() {
  showLoading();
  try {
    const alerts = await API.call({ action: 'checkSLAAlerts' });
    if (!alerts.length) {
      toast('success', 'No hay alertas SLA activas');
    } else {
      toast('warning', `${alerts.length} solicitud(es) con SLA vencido`);
      const dot = document.getElementById('notifDot');
      if (dot) dot.style.display = '';
    }
  } catch(e) { toast('error', e.message); }
  finally { hideLoading(); }
}

// Inicializar sistema (solo primera vez)
async function inicializarSistema() {
  if (!confirm('¿Inicializar el sistema? Esto creará las hojas en Google Sheets.')) return;
  showLoading();
  try {
    const res = await API.call({ action: 'initSystem' });
    toast('success', res.message);
    alert('Sistema iniciado.\nSpreadsheet: ' + res.spreadsheetUrl);
  } catch(e) { toast('error', e.message); }
  finally { hideLoading(); }
}
</script>
